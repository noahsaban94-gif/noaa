    <script>
      // Clean up benign development WebSocket warnings in sandboxed preview iframe
      (function() {
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('vite-plugin-pwa'))) return;
          origError.apply(console, args);
        };
      })();
    </script>
