<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="winBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.85" />
    </linearGradient>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded container with Windows 11 Fluent style -->
  <rect width="512" height="512" rx="112" fill="url(#winBg)" />
  
  <!-- Inner Glass Card -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="url(#cardGrad)" filter="url(#winShadow)" />
  
  <!-- Crane & Truck / Logistics Graphic in crisp Saban Blue -->
  <g transform="translate(110, 110)" stroke="#0284c7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Crane mast & boom -->
    <path d="M40 260 L40 40 L220 40" stroke="#0369a1" stroke-width="20" />
    <path d="M40 100 L100 40 M40 160 L160 40 M40 220 L220 40" stroke="#38bdf8" stroke-width="10" />
    <!-- Cable and hook -->
    <line x1="200" y1="40" x2="200" y2="130" stroke="#64748b" stroke-width="8" stroke-dasharray="8 6" />
    <!-- Pallet/Package being lifted -->
    <rect x="170" y="130" width="60" height="44" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="8" />
    
    <!-- Truck base -->
    <rect x="20" y="240" width="220" height="40" rx="10" fill="#0369a1" stroke="#0284c7" stroke-width="12" />
    <path d="M190 240 L220 240 L240 260 L240 280 L190 280 Z" fill="#0284c7" stroke="#0369a1" stroke-width="10" />
    
    <!-- Wheels -->
    <circle cx="65" cy="285" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="8" />
    <circle cx="165" cy="285" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="8" />
    <circle cx="215" cy="285" r="22" fill="#1e293b" stroke="#94a3b8" stroke-width="8" />
    
    <!-- Heart AI Indicator -->
    <path d="M225 15 C215 0, 190 5, 190 25 C190 40, 225 65, 225 65 C225 65, 260 40, 260 25 C260 5, 235 0, 225 15 Z" fill="#ef4444" stroke="#dc2626" stroke-width="4" />
  </g>
</svg>
